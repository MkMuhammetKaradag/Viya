version: '3.8'

services:
  viya-db:
    image: pgvector/pgvector:pg15-trixie
    container_name: viya-postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:alpine
    container_name: viya-redis
    ports:
      - '6379:6379'
    command: redis-server --requirepass password
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - '5672:5672' 
      - '15672:15672' 
volumes:
  postgres_data:
